name: ai-review

# Runs the checks (type check, tests, build, hook tests) on every PR, drafts included.
# Review and merging are done by the reviewer agent session, not by this workflow
# (AGENTS.md, "Review and merge: the reviewer agent").

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml
