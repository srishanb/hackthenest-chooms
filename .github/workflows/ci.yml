name: ci

# Type check, unit tests and a production build.
# Runs on every push to main, and is called by ai-review.yml on pull requests so the
# AI reviewer (and its auto-merge) only runs after these checks pass.

on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: node scripts/hooks/no-history-rewrite.mjs --self-test
      - run: bash scripts/hooks/test-pre-push.sh
      - run: npm run check
      - run: npm run build
