name: release-game-only

# Publishes GitHub releases for the game-only variant. This file lives only on the game-only branch.
#
# A release is a notes file: docs/releases/game-only-v<version>.md. When a push to game-only adds one
# that has no release yet, this builds the game at that commit, zips dist/, creates the tag
# game-only-v<version> on that commit and publishes a pre-release with the zip attached and the file
# as its notes. A pre-release never replaces the EEG game's release as "Latest".
# A release that already exists is left alone, so editing an old notes file changes nothing.
# Srishan asked for the workflow to create the tag (2026-11-16).
# Type check and tests are not repeated here: ci runs them on every push to the pull request.

on:
  push:
    branches: [game-only]
    paths:
      - 'docs/releases/game-only-v*.md'
      - '.github/workflows/release-game-only.yml'

permissions:
  contents: write

concurrency:
  group: release-game-only
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - name: Find notes files that have no release yet
        id: pending
        run: |
          tags=""
          for notes in docs/releases/game-only-v*.md; do
            [ -f "$notes" ] || continue
            tag="$(basename "$notes" .md)"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag is already released"
            else
              tags="$tags $tag"
            fi
          done
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "to release:${tags:- nothing}"
      - uses: actions/setup-node@v7
        if: steps.pending.outputs.tags != ''
        with:
          node-version: 26
          cache: npm
      - name: Build the game
        if: steps.pending.outputs.tags != ''
        run: |
          npm ci
          npm run build
      - name: Publish
        if: steps.pending.outputs.tags != ''
        env:
          TAGS: ${{ steps.pending.outputs.tags }}
        run: |
          for tag in $TAGS; do
            zip="lighten-up-${tag}.zip"
            (cd dist && zip -q -r "../${zip}" .)
            gh release create "$tag" "$zip" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Lighten Up (game-only) ${tag#game-only-}" \
              --notes-file "docs/releases/${tag}.md"
          done
