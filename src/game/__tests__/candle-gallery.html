<!doctype html><html><head><title>Candle gallery</title>
<style>body{margin:0;background:#11161f;color:#cfd6e4;font:12px monospace}canvas{image-rendering:pixelated;display:block}</style></head><body>
<p style="padding:6px 10px">Rows: six seeds. Columns: idle, run, charge, rise, fall, land, then flame at light 0, 0.5, 1. Animated at the real rates.</p>
<canvas id="c"></canvas>
<script type="module">
// Dev-only visual check of the procedural candle; draws the pure rasters with a plain 2D canvas.
import { createCandleGenome } from './../candle/candle-genome.ts';
import { bodyShape, INITIAL_POSE, poseFrame } from './../candle/candle-pose.ts';
import { rasterCandle } from './../candle/candle-raster.ts';
import { rasterFlame } from './../candle/flame.ts';
const SEEDS=[1,2,3,40,500,6006],POSES=['idle','run','charge','rise','fall','land'],SIZES=[0,0.5,1];
const P=3,CELL=34,CW=22,cols=POSES.length+SIZES.length;
const canvas=document.querySelector('#c');canvas.width=cols*CW*P;canvas.height=SEEDS.length*CELL*P;
const ctx=canvas.getContext('2d');
const hex=(n)=>'#'+n.toString(16).padStart(6,'0');
const draw=(pixels,ox,oy)=>{for(const p of pixels){ctx.fillStyle=hex(p.color);ctx.fillRect((ox+p.x)*P,(oy+p.y)*P,P,P);}};
function frame(now){
  ctx.fillStyle='#11161f';ctx.fillRect(0,0,canvas.width,canvas.height);
  SEEDS.forEach((seed,row)=>{
    const g=createCandleGenome(seed),oy=row*CELL+CELL-3;
    const cells=[...POSES.map((pose)=>({pose,size:0.6})),...SIZES.map((size)=>({pose:'idle',size}))];
    cells.forEach(({pose,size},col)=>{
      const tracker={...INITIAL_POSE,pose,elapsedMs:pose==='land'?(now%600):now};
      const body=rasterCandle(g,bodyShape(tracker,(now%900)/900),1,false);
      const ox=col*CW+CW/2;
      draw(body.pixels,ox,oy);
      draw(rasterFlame(g,{size01:size,timeMs:now,reducedMotion:false,vx:pose==='run'?200:0}),ox+body.wickTip.x,oy+body.wickTip.y);
    });
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.galleryReady=true;
</script></body></html>
